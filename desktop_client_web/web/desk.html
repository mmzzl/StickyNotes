<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
    font-size: 14px; color: #333; background: #f4f3ed; height: 100vh;
    display: flex; flex-direction: column;
  }
  header {
    flex: 0 0 58px; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; background: #fbf9f2; border-bottom: 1px solid #e6e2d2;
  }
  .brand { font-size: 19px; font-weight: 700; color: #57450a; }
  .user { color: #907c3a; font-size: 13px; }
  .spacer { flex: 1; }
  button {
    font-family: inherit; font-size: 14px; cursor: pointer;
    background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 7px 16px;
  }
  button:hover { border-color: #ffb300; color: #a87700; }
  button.primary {
    background: linear-gradient(135deg, #ffc838, #ffb300);
    border: none; color: #4a3300; font-weight: 700; padding: 9px 20px; font-size: 15px;
  }
  .row { display: flex; gap: 8px; align-items: center; padding: 8px 12px 0; }
  input[type=search], input[type=text] {
    flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 7px 10px;
    font-family: inherit; font-size: 14px; background: #fff; outline: none;
  }
  input:focus { border-color: #ffb300; }
  .count { color: #999; font-size: 12px; }
  #list { flex: 1; overflow-y: auto; padding: 10px; }
  .item {
    background: #fff; border: 1px solid #ece9df; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 6px; cursor: pointer;
  }
  .item:hover { border-color: #ffd54f; background: #fffdf4; }
  .item.active { background: #fff3cd; border-color: #ffc838; }
  .item .t { font-weight: 600; }
  .item .p { color: #888; font-size: 12px; margin-top: 3px;
             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { color: #999; text-align: center; padding: 40px 0; }
</style>
</head>
<body>
  <header>
    <span class="brand">📝 便签桌</span>
    <span class="user" id="user"></span>
    <span class="spacer"></span>
    <button id="restore">恢复全部</button>
    <button id="new" class="primary">＋ 新建便签</button>
    <button id="quit">退出</button>
  </header>
  <div class="row">
    <input type="search" id="q" placeholder="搜索标题/内容（回车）">
    <span class="count" id="count"></span>
    <button id="more" style="display:none">加载更多</button>
  </div>
  <div id="list"></div>
<script>
(function () {
  var items = [], page = 1, q = '', total = 0, loaded = 0;
  var api = function () { return window.pywebview && window.pywebview.api; };

  function itemLabel(n) { return (n.title || '').trim() || '(无标题)'; }
  function preview(n) {
    var c = (n.content || '').replace(/[#*`>\-]/g, ' ').replace(/\s+/g, ' ').trim();
    return c ? c.slice(0, 80) : '（空便签）';
  }

  function render() {
    var list = document.getElementById('list');
    if (!items.length) {
      list.innerHTML = '<div class="empty">还没有便签，点右上角「＋ 新建便签」贴一张</div>';
    } else {
      list.innerHTML = items.map(function (n) {
        return '<div class="item" data-id="' + n.id + '">' +
               '<div class="t">' + esc(itemLabel(n)) + '</div>' +
               '<div class="p">' + esc(preview(n)) + '</div></div>';
      }).join('');
      Array.prototype.forEach.call(list.querySelectorAll('.item'), function (el) {
        el.addEventListener('dblclick', function () { open(el.dataset.id); });
        el.addEventListener('click', function () { open(el.dataset.id); });
      });
    }
    document.getElementById('count').textContent =
      total ? ('显示 ' + loaded + ' / 共 ' + total + ' 条') : '';
    document.getElementById('more').style.display = total > loaded ? '' : 'none';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function load(reset) {
    if (reset) { page = 1; items = []; }
    return api().list_notes(q, page, 200).then(function (r) {
      items = reset ? r.items : items.concat(r.items);
      loaded = items.length; total = r.total;
      render();
    }).catch(function (e) {
      document.getElementById('list').innerHTML =
        '<div class="empty">加载失败：' + esc(e) + '</div>';
    });
  }

  function open(id) { api().open_note(id); }

  window.pywebviewSetUser = function (name) {
    document.getElementById('user').textContent = '当前用户：' + (name || '-');
  };
  window.pywebviewRefresh = function () { load(true); };

  document.getElementById('new').addEventListener('click', function () {
    q = ''; document.getElementById('q').value = '';
    api().new_note().then(function () { load(true); });
  });
  document.getElementById('restore').addEventListener('click', function () {
    api().restore_all().then(function () { load(true); });
  });
  document.getElementById('quit').addEventListener('click', function () { api().quit_app(); });
  document.getElementById('more').addEventListener('click', function () {
    page += 1; load(false);
  });
  document.getElementById('q').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { q = this.value.trim(); load(true); }
  });

  window.pywebviewStart = function (username) {
    window.pywebviewSetUser(username);
    load(true);
  };
})();
</script>
</body>
</html>
