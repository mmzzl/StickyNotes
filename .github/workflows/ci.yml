name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8" "pytest-asyncio>=0.23" "ruff>=0.5"

      - name: Lint (fatal rules only)
        run: ruff check backend --select F

      # 迁移脚本必须能建出与模型一致的库；alembic check 会捕捉「改了模型忘了写迁移」
      - name: Migration sanity
        env:
          DATABASE_URL: sqlite+aiosqlite:///${{ github.workspace }}/data/_ci_migration.db
        run: |
          mkdir -p data
          alembic upgrade head
          alembic current
          alembic check

      - name: Backend tests
        run: pytest backend/tests -q

      # 两个桌面目录都叫 tests，合并收集会包名冲突；且 PyQt 版需要 Qt 环境，
      # 因此只把不依赖 GUI 的 web 版逻辑用例单独跑一次。
      - name: Desktop web client logic tests
        run: pytest desktop_client_web/tests -q
