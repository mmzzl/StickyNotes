# Alembic config -- run `alembic upgrade head` from the project root.
# The real DB URL is NOT stored here: migrations/env.py reads DATABASE_URL
# (falling back to backend/config.py settings.database_url) and swaps the
# async driver for its sync counterpart. CLI and app startup share this logic.
# NOTE: keep this file pure ASCII. Alembic reads it with encoding="locale",
# which is GBK on zh-CN Windows and fails on UTF-8 non-ASCII comments.

[alembic]
script_location = migrations
prepend_sys_path = .
# Placeholder only; env.py overrides it at runtime.
sqlalchemy.url = sqlite:///./data/app.db
timezone = Asia/Shanghai
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
