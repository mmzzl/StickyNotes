[project]
name = "sticky-notes"
version = "0.1.0"
description = "多用户便签应用：Web 便签 + 桌面贴纸 + 管理后台（RBAC / JWT / SQLite）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "motor>=3.4",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.8",
    "loguru>=0.7",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
    "pillow>=10.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools]
packages = { find = { where = ["backend"] } }

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 后端源码在 backend/：从项目根直接 pytest 即可，无需手动设 PYTHONPATH
pythonpath = ["backend"]
# 默认只收后端。desktop_client/tests 依赖 PyQt5，且两个桌面目录都叫 tests
# 会与 pytest 的包名解析冲突，需单独运行：
#   pytest desktop_client_web/tests -q                    (纯逻辑，11 例)
#   desktop_client/venv/Scripts/python -m pytest desktop_client/tests -q
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# 只开致命规则（未定义名 / 未使用导入等），历史代码的格式问题不阻断 CI
select = ["F"]
